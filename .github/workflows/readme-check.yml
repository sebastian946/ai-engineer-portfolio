name: README check

on:
  push:
  pull_request:

jobs:
  check-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check mandatory README sections
        run: python scripts/check_readme.py templates/PROJECT_README.md
